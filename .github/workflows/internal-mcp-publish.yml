name: Publish MCP Server (Internal)

on:
  workflow_call:
    inputs:
      server-json:
        description: 'Path to server.json file (relative to repo root)'
        type: string
        required: false
        default: 'server.json'
      set-version-from-tag:
        description: 'If true, extract version from git tag and update server.json'
        type: boolean
        required: false
        default: false
      mcp-publisher-version:
        description: 'Version of mcp-publisher to use (e.g., v1.0.0, or "latest")'
        type: string
        required: false
        default: 'latest'
    outputs:
      server-name:
        description: 'The published server name'
        value: ${{ jobs.publish.outputs.server-name }}
      server-version:
        description: 'The published version'
        value: ${{ jobs.publish.outputs.server-version }}

jobs:
  publish:
    name: Publish to Internal MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      server-name: ${{ steps.publish.outputs.name }}
      server-version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set version from tag
        if: ${{ inputs.set-version-from-tag }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "Setting version to: $VERSION"
          jq --arg v "$VERSION" '.version = $v' "${{ inputs.server-json }}" > tmp.json
          mv tmp.json "${{ inputs.server-json }}"

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          VERSION="${{ inputs.mcp-publisher-version }}"
          if [[ "$VERSION" == "latest" ]]; then
            DOWNLOAD_URL="https://github.com/paychex/payx-mcp-registry/releases/latest/download"
          else
            DOWNLOAD_URL="https://github.com/paychex/payx-mcp-registry/releases/download/$VERSION"
          fi
          TARBALL="mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "Downloading mcp-publisher ($VERSION) for ${OS}/${ARCH}"
          if ! curl -fsSL "$DOWNLOAD_URL/$TARBALL" | tar xz mcp-publisher; then
            echo "Download failed. Verify releases at: https://github.com/paychex/payx-mcp-registry/releases"
            exit 1
          fi
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate and publish
        id: publish
        env:
          REGISTRY_URL: ${{ vars.MCP_REGISTRY_URL || secrets.MCP_REGISTRY_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${REGISTRY_URL}" ]]; then
            echo "Error: MCP_REGISTRY_URL not configured"
            exit 1
          fi

          echo "Checking registry health at ${REGISTRY_URL}"
          if ! curl -fsSL "${REGISTRY_URL}/v0/health" | jq -r '.status' | grep -q '^ok$'; then
            echo "Registry health check failed"
            curl -i "${REGISTRY_URL}/v0/health" || true
            exit 1
          fi

          echo "Authenticating via GitHub OIDC"
          if ./mcp-publisher login github-oidc --registry "${REGISTRY_URL}"; then
            echo "Publishing ${{ inputs.server-json }}"
            if ! ./mcp-publisher publish "${{ inputs.server-json }}"; then
              echo "Publish failed, attempting HTTP fallback"
              FALLBACK=1
            fi
          else
            echo "OIDC login failed, attempting HTTP fallback"
            FALLBACK=1
          fi

          if [[ "${FALLBACK:-0}" == "1" ]]; then
            if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
              echo "Error: Missing GitHub OIDC environment variables"
              exit 1
            fi

            OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mcp-registry"
            echo "Requesting OIDC token from GitHub"
            OIDC_JSON=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" -H "Accept: application/json" "${OIDC_URL}")
            OIDC_TOKEN=$(echo "${OIDC_JSON}" | jq -r '.value')
            if [[ -z "${OIDC_TOKEN}" || "${OIDC_TOKEN}" == "null" ]]; then
              echo "Failed to obtain OIDC token"
              echo "Response: ${OIDC_JSON}"
              exit 1
            fi

            echo "Exchanging OIDC token with registry"
            EXCHANGE_JSON=$(curl -fsSL -X POST -H "Content-Type: application/json" -H "Accept: application/json" \
              -d "{\"oidc_token\": \"${OIDC_TOKEN}\"}" "${REGISTRY_URL}/v0/auth/github-oidc")
            REGISTRY_TOKEN=$(echo "${EXCHANGE_JSON}" | jq -r '.registry_token')
            if [[ -z "${REGISTRY_TOKEN}" || "${REGISTRY_TOKEN}" == "null" ]]; then
              echo "Failed to exchange OIDC token with registry"
              echo "Response: ${EXCHANGE_JSON}"
              exit 1
            fi

            echo "Publishing via HTTP to ${REGISTRY_URL}/v0.1/publish"
            HTTP_STATUS=$(curl -s -o publish_resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${REGISTRY_TOKEN}" -H "Content-Type: application/json" \
              --data-binary "@${{ inputs.server-json }}" "${REGISTRY_URL}/v0.1/publish")
            if [[ "${HTTP_STATUS}" != "200" ]]; then
              echo "HTTP publish failed with status ${HTTP_STATUS}"
              echo "Response:" && cat publish_resp.json || true
              exit 1
            fi
          fi

          NAME=$(jq -r '.name' "${{ inputs.server-json }}")
          VERSION=$(jq -r '.version' "${{ inputs.server-json }}")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Successfully published $NAME v$VERSION"