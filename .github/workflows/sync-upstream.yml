name: Sync with Upstream Registry

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync with upstream

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/modelcontextprotocol/registry.git || true
          git remote -v
      
      - name: Fetch upstream changes
        run: |
          git fetch upstream
          git fetch origin
      
      - name: Check for updates
        id: check_updates
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          CURRENT_COMMIT=$(git rev-parse origin/main)
          
          echo "Upstream: $UPSTREAM_COMMIT"
          echo "Current:  $CURRENT_COMMIT"
          
          if [ "$UPSTREAM_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✅ Updates available from upstream"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ Already up to date"
          fi
      
      - name: Merge upstream changes
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          set +e  # Don't exit on error
          
          git checkout main
          git merge upstream/main --no-edit
          
          if [ $? -eq 0 ]; then
            echo "MERGE_SUCCESS=true" >> $GITHUB_ENV
            echo "✅ Merge completed successfully"
          else
            echo "MERGE_SUCCESS=false" >> $GITHUB_ENV
            echo "⚠️ Merge failed - likely conflicts"
            git merge --abort
            exit 1
          fi
      
      - name: Push changes
        if: steps.check_updates.outputs.has_updates == 'true' && env.MERGE_SUCCESS == 'true'
        run: |
          set +e  # Don't exit on error
          
          git push origin main
          
          if [ $? -eq 0 ]; then
            echo "✅ Successfully synced with upstream"
          else
            echo "⚠️ Push failed - likely due to workflow file restrictions"
            echo "Creating sync branch instead..."
            
            BRANCH_NAME="sync-upstream-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
            
            echo "## ⚠️ Manual Merge Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Branch \`$BRANCH_NAME\` created with upstream changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Why:** GitHub prevents automatic updates to workflow files for security." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**To merge:**" >> $GITHUB_STEP_SUMMARY
            echo "1. [Create PR from branch](${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH_NAME)" >> $GITHUB_STEP_SUMMARY
            echo "2. Review and merge" >> $GITHUB_STEP_SUMMARY
            
            exit 0  # Don't fail the workflow
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "## Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_updates.outputs.has_updates }}" == "true" ]; then
            if [ "${{ env.MERGE_SUCCESS }}" == "true" ]; then
              echo "✅ Successfully synced with upstream" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Merge conflicts detected - manual resolution needed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**To resolve:**" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
              echo "git fetch upstream" >> $GITHUB_STEP_SUMMARY
              echo "git merge upstream/main" >> $GITHUB_STEP_SUMMARY
              echo "# Resolve conflicts, then:" >> $GITHUB_STEP_SUMMARY
              echo "git add ." >> $GITHUB_STEP_SUMMARY
              echo "git commit && git push" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "✅ Already up to date with upstream" >> $GITHUB_STEP_SUMMARY
          fi
          