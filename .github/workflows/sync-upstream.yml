name: Sync with Upstream Registry

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync with upstream

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/modelcontextprotocol/registry.git 2>/dev/null || true
          git remote -v
      
      - name: Fetch upstream changes
        run: |
          git fetch upstream
          git fetch origin
      
      - name: Check for updates
        id: check_updates
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          CURRENT_COMMIT=$(git rev-parse origin/main)
          
          echo "Upstream: $UPSTREAM_COMMIT"
          echo "Current:  $CURRENT_COMMIT"
          
          if [ "$UPSTREAM_COMMIT" != "$CURRENT_COMMIT" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✅ Updates available from upstream"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ Already up to date"
          fi
      
      - name: Merge and push upstream changes
        if: steps.check_updates.outputs.has_updates == 'true'
        id: merge
        run: |
          git checkout main

          # Attempt merge
          if ! git merge upstream/main --no-edit; then
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "⚠️ Merge conflicts detected"
            git merge --abort
            exit 1
          fi

          # Attempt push
          if ! git push origin main; then
            echo "status=push_failed" >> $GITHUB_OUTPUT
            echo "⚠️ Push failed - likely due to workflow file restrictions"
            
            # Create branch for manual merge
            BRANCH_NAME="sync-upstream-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
            echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Successfully synced with upstream"
      
      - name: Success summary
        if: steps.check_updates.outputs.has_updates == 'true' && steps.merge.outputs.status == 'success'
        run: |
          echo "## ✅ Sync Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your fork has been successfully synced with \`modelcontextprotocol/registry\`" >> $GITHUB_STEP_SUMMARY

      - name: Push failed summary
        if: failure() && steps.merge.outputs.status == 'push_failed'
        run: |
          echo "## ⚠️ Manual Merge Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Push to main failed (likely workflow file changes)." >> $GITHUB_STEP_SUMMARY
          echo "Branch \`${{ steps.merge.outputs.branch_name }}\` created with changes." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To complete sync:**" >> $GITHUB_STEP_SUMMARY
          echo "1. [Create PR](${{ github.server_url }}/${{ github.repository }}/compare/main...${{ steps.merge.outputs.branch_name }})" >> $GITHUB_STEP_SUMMARY
          echo "2. Review and merge" >> $GITHUB_STEP_SUMMARY

      - name: Conflict summary
        if: failure() && steps.merge.outputs.status == 'conflict'
        run: |
          echo "## ⚠️ Merge Conflicts Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Automatic sync failed due to merge conflicts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To resolve manually:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "git remote add upstream https://github.com/modelcontextprotocol/registry.git" >> $GITHUB_STEP_SUMMARY
          echo "git fetch upstream" >> $GITHUB_STEP_SUMMARY
          echo "git checkout main" >> $GITHUB_STEP_SUMMARY
          echo "git merge upstream/main" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Resolve conflicts in your editor, then:" >> $GITHUB_STEP_SUMMARY
          echo "git add ." >> $GITHUB_STEP_SUMMARY
          echo "git commit" >> $GITHUB_STEP_SUMMARY
          echo "git push origin main" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: No updates summary
        if: steps.check_updates.outputs.has_updates == 'false'
        run: |
          echo "## ✅ Already Up to Date" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No new changes from upstream." >> $GITHUB_STEP_SUMMARY
          