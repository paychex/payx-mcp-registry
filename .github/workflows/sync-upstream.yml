name: Sync with Upstream Registry

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch full history to enable merge-base checks
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/modelcontextprotocol/registry.git 2>/dev/null || true

      - name: Fetch upstream changes
        run: |
          git fetch upstream
          git fetch origin

      - name: Check for updates
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          CURRENT=$(git rev-parse origin/main)

          echo "Upstream: $UPSTREAM"
          echo "Current:  $CURRENT"

          # Check if upstream is already merged (current contains all upstream commits)
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ Already up to date"
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✅ Updates available from upstream"
          fi

      - name: Sync upstream changes
        if: steps.check.outputs.has_updates == 'true'
        id: sync
        run: |
          git checkout main

          # Helper: create a sync branch from upstream/main and open a PR
          create_sync_pr() {
            local reason="$1"
            BRANCH_NAME="sync/upstream-$(date +%Y%m%d)"
            git checkout -b "$BRANCH_NAME" upstream/main
            git push -f origin "$BRANCH_NAME"

            EXISTING_PR=$(gh pr list \
              --repo "${{ github.repository }}" \
              --head "$BRANCH_NAME" \
              --base main \
              --json number \
              --jq '.[0].number' 2>&1 || true)

            if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
              echo "status=pr_exists" >> $GITHUB_OUTPUT
              echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
              echo "ℹ️ Sync PR #$EXISTING_PR already exists — branch updated"
            else
              PR_BODY="## Automated upstream sync\n\nThis PR brings in the latest changes from [\`modelcontextprotocol/registry\`](https://github.com/modelcontextprotocol/registry).\n\n**Reason:** $reason\n\n### To merge locally:\n\n\`\`\`bash\ngit fetch origin\ngit checkout $BRANCH_NAME\ngit merge main\n# Resolve any conflicts, then:\ngit add .\ngit commit\ngit push\n\`\`\`\n\nOr merge directly via the GitHub UI."

              if PR_URL=$(gh pr create \
                --repo "${{ github.repository }}" \
                --title "Sync with upstream $(date +%Y-%m-%d)" \
                --body "$PR_BODY" \
                --base main \
                --head "$BRANCH_NAME" 2>&1); then
                echo "status=pr_created" >> $GITHUB_OUTPUT
                echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
                echo "⚠️ $reason — PR created: $PR_URL"
              else
                echo "status=branch_created" >> $GITHUB_OUTPUT
                echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
                echo "⚠️ Branch created but PR creation failed: $PR_URL"
                echo "⚠️ Create PR manually: https://github.com/${{ github.repository }}/compare/main...$BRANCH_NAME?expand=1"
              fi
            fi
          }

          # Fast path: clean merge directly to main
          if git merge upstream/main --no-edit; then
            # Check if the merge brought in any .github/workflows/ file changes.
            # GITHUB_TOKEN is unconditionally blocked from pushing workflow files
            # (GitHub platform restriction — no permission scope can override this).
            # Route to a PR instead so a human can review and merge.
            if git diff --name-only origin/main HEAD | grep -q '^\.github/workflows/'; then
              echo "⚠️ Upstream changes include workflow files — GITHUB_TOKEN cannot push these"
              echo "⚠️ Falling back to PR creation"
              git reset --hard origin/main
              create_sync_pr "Upstream changes include .github/workflows/ files, which require a PAT or manual merge (GITHUB_TOKEN cannot push workflow files)"
            elif git push origin main; then
              echo "status=success" >> $GITHUB_OUTPUT
              echo "✅ Successfully synced with upstream"
            else
              # Push rejected for another reason (branch protection, etc.)
              echo "⚠️ Direct push to main rejected — falling back to PR"
              git reset --hard origin/main
              create_sync_pr "Direct push was rejected (branch protection or other policy)"
            fi
          else
            # Conflicts — abort merge, create a PR instead
            git merge --abort
            create_sync_pr "Merge conflicts that need manual resolution"
            # Exit successfully - conflicts are handled via PR
            exit 0
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.has_updates }}" == "false" ]; then
            echo "## ✅ Already Up to Date" >> $GITHUB_STEP_SUMMARY
            echo "No new changes from upstream." >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.sync.outputs.status }}" == "success" ]; then
            echo "## ✅ Sync Successful" >> $GITHUB_STEP_SUMMARY
            echo "Fork synced with \`modelcontextprotocol/registry\`." >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.sync.outputs.status }}" == "pr_created" ]; then
            echo "## ⚠️ PR Created for Manual Resolution" >> $GITHUB_STEP_SUMMARY
            echo "Merge conflicts detected. A PR has been created:" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.sync.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.sync.outputs.status }}" == "pr_exists" ]; then
            echo "## ℹ️ Existing Sync PR Updated" >> $GITHUB_STEP_SUMMARY
            echo "PR #${{ steps.sync.outputs.pr_number }} branch has been updated with latest upstream." >> $GITHUB_STEP_SUMMARY

          elif [ "${{ steps.sync.outputs.status }}" == "branch_created" ]; then
            echo "## ⚠️ Branch Created - Manual PR Needed" >> $GITHUB_STEP_SUMMARY
            echo "Merge conflicts detected. Branch \`${{ steps.sync.outputs.branch_name }}\` created." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action required:** Create PR manually at:" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/${{ github.repository }}/compare/main...${{ steps.sync.outputs.branch_name }}?expand=1" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Automatic PR creation failed. Check workflow permissions or gh CLI authentication." >> $GITHUB_STEP_SUMMARY

          else
            echo "## ❌ Sync Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
          fi
